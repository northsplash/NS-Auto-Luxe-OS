name: Deploy website apply

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/submit-job-application/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-website-apply.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function and apply SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: hoyrumpztfyhzzljpstl
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set. Add it as a GitHub Actions secret to deploy website apply."
            exit 0
          fi
          if [ -d supabase/functions/submit-job-application ]; then
            supabase functions deploy submit-job-application --project-ref "$PROJECT_REF" --no-verify-jwt
          fi
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request, sys
          files = [
            'supabase/migrations/20260907180000_website_apply_rpc.sql',
            'supabase/migrations/20260909050000_site_visits_anon_log.sql',
          ]
          failed = 0
          for rel in files:
            path = pathlib.Path(rel)
            if not path.exists():
              print('skip missing', rel)
              continue
            sql = path.read_text()
            req = urllib.request.Request(
                f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/query",
                data=json.dumps({'query': sql}).encode(),
                headers={
                    'Authorization': f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    'User-Agent': 'Mozilla/5.0',
                },
                method='POST',
            )
            try:
                with urllib.request.urlopen(req, timeout=60) as r:
                    print('sql', rel, r.status, r.read()[:400])
            except urllib.error.HTTPError as e:
                print('sql_error', rel, e.code, e.read()[:1000])
                failed = 1
          sys.exit(failed)
          PY
