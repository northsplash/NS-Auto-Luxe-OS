name: Deploy website apply

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/submit-job-application/**'
      - 'supabase/migrations/**website*apply*'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-website-apply.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function and apply SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: hoyrumpztfyhzzljpstl
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set. Add it as a GitHub Actions secret to deploy website apply."
            exit 0
          fi
          supabase functions deploy submit-job-application --project-ref "$PROJECT_REF" --no-verify-jwt
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request
          sql = pathlib.Path('supabase/migrations/20260907180000_website_apply_rpc.sql').read_text()
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/query",
              data=json.dumps({'query': sql}).encode(),
              headers={
                  'Authorization': f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'Mozilla/5.0',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print('sql', r.status, r.read()[:500])
          except urllib.error.HTTPError as e:
              print('sql_error', e.code, e.read()[:1000])
              raise SystemExit(1)
          PY
