name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploy by pushing the built site to the gh-pages branch.
# That matches the repo Pages source (branch: gh-pages) and avoids the
# github-pages environment, which currently blocks deployments from main.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Publish dist to gh-pages
        run: |
          set -euo pipefail
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          cp "$GITHUB_WORKSPACE/vercel.gh-pages.json" dist/vercel.json
          cd dist
          git init
          git checkout -b gh-pages
          git add -A
          git -c user.name='github-actions' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m "Publish GitHub Pages"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
